<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script>

const VERSION = "1.0"; // ** ADJUST VARIABLE TO FORCE CACHE REFRESH **

const link = document.createElement("link");
link.rel = "stylesheet";
link.href = "styles.css?v=" + VERSION;
document.head.appendChild(link);
</script>

</head>

<body>

<h2>Roster</h2>

<div id ="viewButtons"></div>

<input type="text" id="search" placeholder="Name...">

<div id="playerList">Loading...</div>

<script>
let currentData = [];
let allData = {};
let currentView = "Roster";

// Load config
const config = [
  { type: "roster", file: `data/roster.html?v=${VERSION}`, label: "Roster" }
];

// Load roster first
async function loadRoster() {
  const res = await fetch(config[0].file);
  const html = await res.text();
  config[0].html = html; // add html property
}

// Load all round files dynamically
async function loadRounds() {
  let i = 1;
  while (true) {
    const fileUrl = `data/round${i}.html?v=${VERSION}`;
    try {
      const res = await fetch(fileUrl);
      if (!res.ok) break; // stop if file doesn’t exist
      const html = await res.text();

      config.push({
        type: "round",
        file: `data/round${i}.html`,
        label: `R${i}`,
        html
      });

      i++;
    } catch (err) {
      break; // stop on fetch error
    }
  }
}

// Main loader
async function loadAllData() {
  await loadRoster();
  await loadRounds();

  // Create buttons
  createButtons(config);

  // Parse all data
  config.forEach(file => {
    if (file.type === "roster") {
      allData[file.label] = parseRoster(file.html);
    } else {
      allData[file.label] = parsePairings(file.html);
    }
  });

  // Default view
  currentView = Object.keys(allData)[0];
  currentData = allData[currentView];
  render(currentData);
}

// Call it
loadAllData();

// 🔹 BUTTONS
function createButtons(config) {
  let container = document.getElementById("viewButtons");

  config.forEach(item => {
    let btn = document.createElement("button");
    btn.textContent = item.label;

    btn.classList.add("btn");

    btn.onclick = () => {
      currentView = item.label;
      currentData = allData[currentView];
      render(currentData);
    };

    container.appendChild(btn);
  });
}

// 🔹 PARSE ROSTER
function parseRoster(html) {
  let doc = new DOMParser().parseFromString(html, "text/html");
  let rows = doc.querySelectorAll(".players_table tbody tr");

  let players = [];

  rows.forEach(row => {
    let name = row.children[1]?.textContent.trim();
    if (name) {
      players.push({ name });
    }
  });

  return players;
}

// 🔹 PARSE PAIRINGS
function parsePairings(html) {
  let doc = new DOMParser().parseFromString(html, "text/html");

  // Only tables with class "report"
  let rows = doc.querySelectorAll("table.report tr");

  let pairings = [];

  rows.forEach((row, i) => {
    if (i === 0) return; // skip header

    let cols = row.children;

    let table = cols[0]?.textContent.trim();
    let player = cleanName(cols[1]?.textContent);
    let opponent = cleanName(cols[3]?.textContent);

    if (player) {
      pairings.push({
        name: player,
        opponent,
        table
      });
    }
  });

  return pairings;
}

// 🔹 CLEAN NAME (removes record text)
function cleanName(text) {
  if (!text) return "";
  return text.replace(/\([^()]*\)/g, "").trim();
}

// 🔹 RENDER
function render(data) {
  let container = document.getElementById("playerList");
  container.innerHTML = "";

  data.forEach(item => {
    let div = document.createElement("div");
    div.className = "player";

    if (currentView === "Roster") {
      div.innerHTML = `<strong>${item.name}</strong>`;
    } else {
      div.innerHTML = `
        <strong>${item.name}</strong> <div class="meta">Table ${item.table} vs ${item.opponent || "BYE"}</div>
      `;
    }

    container.appendChild(div);
  });
}

// 🔹 SEARCH
document.getElementById("search").addEventListener("input", function() {
  let value = this.value.toLowerCase();

  let filtered = currentData.filter(item =>
    item.name.toLowerCase().includes(value)
  );

  render(filtered);
});
</script>

</body>
</html>
