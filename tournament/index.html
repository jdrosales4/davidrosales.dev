<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css?v=1.0" />
</head>

<body>

<h2>Roster</h2>

<div id ="viewButtons"></div>

<input type="text" id="search" placeholder="Name...">

<div id="playerList">Loading...</div>

<script>

function clearName(name) {
    if (!name) return "";
    return name.replace(/\(.*?\)/g, "").trim();
}

function render(data) {
    let container = document.getElementById("playerList");
    container.innerHTML = "";

    data.forEach(item => {
        let div = document.createElement("div");
        div.className = "player";

        if (currentView === "Roster") {
            div.innerHTML = `<strong>${item.name}</strong>`;
            
            // this part is optional, you can include it if you want to show the table and division info for each player

            //<div class="meta">
            //    Table ${p.table} • ${p.division}
            //</div>
        //;

        } else {
            div.innerHTML = `
                <strong>${item.name}</strong>
                <div class="meta">
                    Table ${item.table} vs ${item.opponent || "Bye"}
                </div>
            `;
        }

        container.appendChild(div);
    });
}

// Search
document.getElementById("search").addEventListener("input", function() {
    let value = this.value.toLowerCase();

    let filtered = currentData.filter(item =>
        item.name.toLowerCase().includes(value)
    );

    renderPlayers(filtered);
});
</script>

</body>
</html>
