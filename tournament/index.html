<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css?v=1.0" />
</head>

<body>

<h2>Roster</h2>

<input type="text" id="search" placeholder="Name...">

<div id="playerList">Loading...</div>

<script>
let allPlayers = [];

// Load your single roster file
fetch("data/roster.html?v=1.0")
  .then(res => res.text())
  .then(html => {
    let parser = new DOMParser();
    let doc = parser.parseFromString(html, "text/html");

    let rows = doc.querySelectorAll(".players_table tbody tr");

    rows.forEach(row => {
        let table = row.children[0]?.textContent.trim();
        let name = row.children[1]?.textContent.trim();
        let division = row.children[2]?.textContent.trim();

        if (name) {
            allPlayers.push({
                name,
                table,
                division
            });
        }
    });

    renderPlayers(allPlayers);
  });

function renderPlayers(players) {
    let container = document.getElementById("playerList");
    container.innerHTML = "";

    players.forEach(p => {
        let div = document.createElement("div");
        div.className = "player";

        div.innerHTML = `
            <strong>${p.name}</strong>`;

            // this part is optional, you can include it if you want to show the table and division info for each player

            //<div class="meta">
            //    Table ${p.table} • ${p.division}
            //</div>
        //;

        container.appendChild(div);
    });
}

// Search
document.getElementById("search").addEventListener("input", function() {
    let value = this.value.toLowerCase();

    let filtered = allPlayers.filter(p =>
        p.name.toLowerCase().includes(value)
    );

    renderPlayers(filtered);
});
</script>

</body>
</html>
